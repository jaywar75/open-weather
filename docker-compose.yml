version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: openweather
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db/openweather
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: ["npm", "run", "dev"]

  client:
    build: .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    env_file:
      - .env
    stdin_open: true
    tty: true
    depends_on:
      - db

volumes:
  postgres_data: